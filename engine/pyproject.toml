[project]
name = "tradehub-engine"
version = "0.1.0"
description = "TradeHub deterministic engine: scanner, detectors, exits, Guardian, execution, backtester, analytics. Rules in code; judgment in Hermes."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "supabase>=2.7",
    "alpaca-py>=0.30",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
