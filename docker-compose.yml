# TradeHub local stack — this Windows PC (Docker Desktop, WSL2 backend).
# Ollama runs NATIVELY on Windows (GPU access), not in this compose file; the engine
# reaches it via host.docker.internal:11434 (see .env.example OLLAMA_BASE_URL).

services:
  engine:
    build: ./engine
    container_name: tradehub-engine
    env_file: .env
    environment:
      TZ: America/New_York
      OLLAMA_BASE_URL: http://host.docker.internal:11434   # Ollama runs natively on Windows (GPU)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./prompt-library:/srv/prompt-library:ro
      - ./data:/srv/data                                   # REPO_ROOT/data — the same directory the host CLI uses
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The synthetic pre-market stop (plan §12 rule 3). Its OWN container on purpose: rebuilding the engine
  # after a code change must never take the stop down while a position is open, and a crash here restarts
  # only this. Reuses the engine image — same code, different entrypoint.
  monitor:
    build: ./engine
    container_name: tradehub-monitor
    env_file: .env
    environment:
      TZ: America/New_York
      MONITOR_REFRESH_SECONDS: "30"      # how often the watch list is rebuilt from open positions
      MONITOR_SLIP_THROUGH_PCT: "0.5"    # how far through the stop the exit limit is priced
      MONITOR_HEARTBEAT_MINUTES: "0"     # >0 sends a periodic "still alive" Telegram message
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.monitor.synthetic_stop"]
    restart: unless-stopped
    depends_on:
      - engine

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: tradehub-n8n
    environment:
      GENERIC_TIMEZONE: America/New_York   # every cron in the app is defined in ET (plan §4 timeline)
      TZ: America/New_York
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/  # replaced by the Cloudflare Tunnel / Tailscale URL in Phase 8
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-before-first-run}
    ports:
      - "5678:5678"
    volumes:
      - ./n8n/data:/home/node/.n8n
      - ./n8n/workflows:/srv/workflows:ro
    restart: unless-stopped
    depends_on:
      - engine
