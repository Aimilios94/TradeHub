# TradeHub stack. Start: docker compose up -d --build
# Every published port is bound to 127.0.0.1. PostgreSQL publishes no port at all:
# it is reachable only inside the Compose network, and the API is its only client.
# Ollama runs on the host and is reached through host.docker.internal.
name: tradehub

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/srv/data
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      # Wait for the API so the first dump is taken after migrations and seeds.
      api:
        condition: service_healthy
    volumes:
      - ./db/backup.sh:/backup.sh:ro
      - ./backups:/backups

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5680}/
      # Workflows read the secret with {{ $env.N8N_TRIGGER_SECRET }} and send it as X-Trigger-Secret.
      N8N_TRIGGER_SECRET: ${N8N_TRIGGER_SECRET}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflow exports from the repo, for: n8n import:workflow --separate --input=/workflows
      - ./n8n:/workflows:ro
    ports:
      - "127.0.0.1:${N8N_PORT:-5680}:5678"

volumes:
  pgdata:
  n8n_data:
